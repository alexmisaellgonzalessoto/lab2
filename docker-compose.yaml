services:
  app1:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE_APP1}

  app2:
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE_APP2}

  app3:
    build: ./api
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE_APP3}

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: